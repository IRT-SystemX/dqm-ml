# This file is an example of pipeline configuration for DQM
# in datapath field: if path is a file, the dataset is considered to be stored inn this file, if pathis a folder, a file in the given folder will be concatenated : Supported format for file are csv,xlsx and parquet.
# by row to form the evaluated dataset
# if column_names field  is present the metric is computed for each column, otherwise the metric will be computed on all columns by default
# if metrics field is not present : all metrics will be computed by default

# For domain gap , desired metrics shall explicitly set as primary key, then the config in method_config key.


pipeline_definition:
  - domain : "completeness"
    dataset : "tests/sample_data/completeness_sample_data.csv"
    columns_names : ["column_1","column_3","column_6","column_9"]

  - domain : "representativeness"
    metrics: ["chi-square","GRTE"]
    bins : 10
    distribution : normal
    dataset: "tests/sample_data/SMD_test_ds_sample.csv"
    columns_names : ["column_2","column_4", "column_6"]
    
  - domain : "diversity"
    metrics: ["simpson","gini"]
    dataset: "tests/sample_data/SMD_test_ds_sample.csv"
    columns_names : ["column_2","column_4", "column_6"]

  - domain: "domain_gap"
    metrics:
      - metric_name: wasserstein
        method_config:
            DATA: 
                batch_size: 32
                height: 299
                width: 299
                norm_mean: [0.485,0.456,0.406]
                norm_std: [0.229,0.224,0.225]
                source: "tests/sample_data/image_test_ds/c20"
                target: "tests/sample_data/image_test_ds/c33"  
            MODEL:
                arch: "resnet18"
                device: "cpu"
                n_layer_feature: -2
            METHOD: 
                name: "fid"
      - metric_name: PAD
        method_config:
            DATA: 
                batch_size: 10
                height: 224
                width: 224
                norm_mean: [0.485,0.456,0.406]
                norm_std: [0.229,0.224,0.225]
                source: "tests/sample_data/image_test_ds/c20"
                target: "tests/sample_data/image_test_ds/c33"

            MODEL: 
                arch: ["efficientnet_b0","vgg16"]
                device: "cpu"
                n_layer_feature: -2
            
            METHOD: 
                name: "proxy"
                evaluator: "mse"